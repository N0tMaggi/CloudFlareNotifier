name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Remove API tokens, zone IDs and IP addresses** before posting.
        Security problems go through private reporting instead, see SECURITY.md.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - npm (@maggidev/cloudflare-notifier)
        - Python (cloudflare-notifier)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: "Node.js 24.1 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the full error message from your error handler.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal code to reproduce
      render: ts
